version: '3.9'

services:
  # ====================================
  # Infrastructure Services
  # ====================================

  postgres:
    image: postgres:15-alpine
    container_name: studystream-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: auth_db,user_db,task_db,notification_db,llm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/create-multiple-postgresql-databases.sh:/docker-entrypoint-initdb.d/create-multiple-postgresql-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - studystream-network

  redis:
    image: redis:7-alpine
    container_name: studystream-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - studystream-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: studystream-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - studystream-network

  # ====================================
  # Microservices
  # ====================================

  auth_service:
    build:
      context: ../services/auth_service
      dockerfile: Dockerfile
    container_name: studystream-auth
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/auth_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_MINUTES=60
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - studystream-network
    restart: unless-stopped

  user_service:
    build:
      context: ../services/user_service
      dockerfile: Dockerfile
    container_name: studystream-user
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/user_db
      - REDIS_URL=redis://redis:6379/1
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - AUTH_SERVICE_URL=http://auth_service:8001
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - studystream-network
    restart: unless-stopped

  task_service:
    build:
      context: ../services/task_service
      dockerfile: Dockerfile
    container_name: studystream-task
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/task_db
      - REDIS_URL=redis://redis:6379/2
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - studystream-network
    restart: unless-stopped

  notification_service:
    build:
      context: ../services/notification_service
      dockerfile: Dockerfile
    container_name: studystream-notification
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/notification_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - EMAIL_ENABLED=false
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - studystream-network
    restart: unless-stopped

  llm_service:
    build:
      context: ../services/llm_service
      dockerfile: Dockerfile
    container_name: studystream-llm
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/llm_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - TASK_SERVICE_URL=http://task_service:8003
      - LLM_PROVIDER=mock
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      task_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - studystream-network
    restart: unless-stopped

  # ====================================
  # API Gateway
  # ====================================

  gateway:
    image: nginx:alpine
    container_name: studystream-gateway
    ports:
      - "80:80"
    volumes:
      - ../gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth_service
      - user_service
      - task_service
      - notification_service
      - llm_service
    networks:
      - studystream-network
    restart: unless-stopped

  # ====================================
  # Monitoring (Optional)
  # ====================================

  prometheus:
    image: prom/prometheus:latest
    container_name: studystream-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - studystream-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: studystream-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - studystream-network
    restart: unless-stopped

# ====================================
# Networks
# ====================================

networks:
  studystream-network:
    driver: bridge
    name: studystream-network

# ====================================
# Volumes
# ====================================

volumes:
  postgres_data:
    name: studystream-postgres-data
  redis_data:
    name: studystream-redis-data
  rabbitmq_data:
    name: studystream-rabbitmq-data
  prometheus_data:
    name: studystream-prometheus-data
  grafana_data:
    name: studystream-grafana-data
