global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'studystream'
    environment: 'development'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Auth Service
  - job_name: 'auth_service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['auth_service:8001']
        labels:
          service: 'auth'

  # User Service
  - job_name: 'user_service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['user_service:8002']
        labels:
          service: 'user'

  # Task Service
  - job_name: 'task_service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['task_service:8003']
        labels:
          service: 'task'

  # Notification Service
  - job_name: 'notification_service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['notification_service:8004']
        labels:
          service: 'notification'

  # LLM Service
  - job_name: 'llm_service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['llm_service:8005']
        labels:
          service: 'llm'

  # PostgreSQL Exporter (optional - requires postgres_exporter)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres_exporter:9187']

  # Redis Exporter (optional - requires redis_exporter)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis_exporter:9121']

  # RabbitMQ (optional - requires rabbitmq_exporter or management plugin)
  # - job_name: 'rabbitmq'
  #   static_configs:
  #     - targets: ['rabbitmq:15692']
