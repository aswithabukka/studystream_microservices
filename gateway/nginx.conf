events {
    worker_connections 1024;
}

http {
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Upstream services
    upstream auth_service {
        server auth_service:8001;
    }

    upstream user_service {
        server user_service:8002;
    }

    upstream task_service {
        server task_service:8003;
    }

    upstream notification_service {
        server notification_service:8004;
    }

    upstream llm_service {
        server llm_service:8005;
    }

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Main server block
    server {
        listen 80;
        server_name localhost;

        # Request size limits
        client_max_body_size 10M;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Common proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Auth Service routes
        location /auth/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://auth_service/;
        }

        # User Service routes
        location /users/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://user_service/;
        }

        # Task Service routes
        location /tasks/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://task_service/;
        }

        # Notification Service routes
        location /notifications/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://notification_service/;
        }

        # LLM Service routes
        location /llm/ {
            limit_req zone=api_limit burst=5 nodelay;  # Lower rate for LLM
            proxy_pass http://llm_service/;
        }

        # Default route - API documentation
        location / {
            return 200 '{
                "message": "StudyStream API Gateway",
                "version": "1.0.0",
                "services": {
                    "auth": "/auth/docs",
                    "users": "/users/docs",
                    "tasks": "/tasks/docs",
                    "notifications": "/notifications/docs",
                    "llm": "/llm/docs"
                }
            }';
            add_header Content-Type application/json;
        }
    }
}
